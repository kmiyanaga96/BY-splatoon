<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="BY">
  <!-- BYリーグのアイコン (ファビコン・アプリのヘッダー用)。競技用エンブレムから添え字を外し、マークを大きくしたもの -->
  <defs>
    <mask id="lg-b" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="140">
      <rect x="-20" y="-20" width="200" height="140" fill="#fff"/>
      <rect x="34" y="20" width="14" height="16" rx="3" fill="#000"/>
      <rect x="34" y="57" width="20" height="21" rx="4" fill="#000"/>
      <path d="M58 8H82L96 46L110 8H134L108 60V92H84V60Z" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
      <path d="M0 0H22L0 22Z" fill="#000"/>
    </mask>
    <mask id="lg-y" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="140">
      <rect x="-20" y="-20" width="200" height="140" fill="#fff"/>
      <rect x="111" y="27" width="30" height="3.5" fill="#000"/>
      <path d="M98 94L112 80V100H98Z" fill="#000"/>
    </mask>
  </defs>
  <!-- 外枠: 尖り上下の六角形 (外接円 r=180 → Discord の円形切り抜きに収まる) -->
  <polygon points="200,20 355.9,110 355.9,290 200,380 44.1,290 44.1,110" fill="#121418" stroke="#121418" stroke-width="10" stroke-linejoin="round"/>
  <!-- ネオンの内枠 (r=164) -->
  <polygon points="200,36 342,118 342,282 200,364 58,282 58,118" fill="none" stroke="#C8FF00" stroke-width="5" stroke-linejoin="miter"/>
  <!-- 内枠の左右に入る斜めスリット (枠の色で上書きして切る) -->
  <path d="M335 163L349 149M51 251L65 237" stroke="#121418" stroke-width="9"/>
  <!-- シンボル: 160×100 のマークを 1.75 倍、中心 (200,200) -->
  <g transform="translate(60 112.5) scale(1.75)">
    <g transform="translate(19.6 0) skewX(-12)">
      <g mask="url(#lg-b)" fill="#F2F4F7">
        <rect x="8" y="8" width="26" height="84" rx="4"/>
        <rect x="8" y="8" width="54" height="40" rx="16"/>
        <rect x="8" y="44" width="66" height="48" rx="18"/>
      </g>
      <path mask="url(#lg-y)" d="M58 8H82L96 46L110 8H134L108 60V92H84V60Z" fill="#C8FF00"/>
    </g>
  </g>
</svg>
