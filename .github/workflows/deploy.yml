# main ブランチに push すると、Firestore のルールを反映してから GitHub Pages に公開する。
# 初回のみ: リポジトリの Settings > Pages > Source を「GitHub Actions」にする。
# Firestore のルールの反映には、Firebase ルール管理者のサービスアカウントの鍵 (JSON) を
# リポジトリのシークレット FIREBASE_SERVICE_ACCOUNT に登録しておく。
# storage.rules (優勝賞品の動画) はここでは反映しない。変更したら npm run deploy:rules で手元から反映する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 新しい画面が新しいルールを前提にすることがあるので、画面の公開より先にルールを反映する
  rules:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx firebase deploy --only firestore:rules --project by-splatoon --non-interactive

  deploy:
    needs: [build, rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
